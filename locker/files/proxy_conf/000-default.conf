<VirtualHost *:443>
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/domain.crt
	SSLCertificateKeyFile /etc/ssl/private/domain.key

	ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
	CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

	<Location />
		PerlAccessHandler SSOApache
	</Location>

	ProxyPreserveHost on
	RequestHeader set X-Forwarded-Proto "https"

	<LocationMatch "^/proxy/">
		ProxyPreserveHost off
		Header edit Location "^https?://([0-9.]+):([0-9]+)(/?.*)" "/proxy/$1/$2$3"
	</LocationMatch>

	<LocationMatch "^/jproxy/">
		ProxyPreserveHost off
		Header edit Location "^https?://([0-9.]+):([0-9]+)(/jproxy/.*)" "$3"
	</LocationMatch>

	ProxyPass "/proxy/" "!"
	ProxyPass "/jproxy/" "!"
	ProxyPass "/" "http://localhost:5000/"
	ProxyPassReverse "/" "http://localhost:5000/"

	RewriteEngine On

	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/jproxy/([0-9.]+)/([0-9]+)/(.*)$ ws://$1:$2/jproxy/$1/$2/$3 [P,L]

	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/proxy/([0-9.]+)/([0-9]+)/(.*)$ ws://$1:$2/$3 [P,L]

	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule /(.*)           ws://localhost:5000/$1 [P,L]

	RewriteRule ^/jproxy/([0-9.]+)/([0-9]+)/(.*)$ http://$1:$2/jproxy/$1/$2/$3 [P,L]

	RewriteRule ^/proxy/([0-9.]+)/([0-9]+)/(.*)$ http://$1:$2/$3 [P,L]
</VirtualHost>
